[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "evo-wam"
version = "0.2.0"
description = "RoboTwin world action model and inverse dynamics pipeline"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "PyYAML>=6"]

[project.optional-dependencies]
data = ["pyarrow", "pandas", "Pillow"]

[project.scripts]
evo-wam = "evo_wam.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"evo_wam.verification.protocols.droid" = ["*.json"]
"evo_wam.verification.protocols.robotwin_dense" = ["*.json"]
